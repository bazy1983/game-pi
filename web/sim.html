<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LED Strip Simulator</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050608; color: #8a93a6; font: 13px system-ui, sans-serif; }
    body { display: flex; justify-content: center; align-items: stretch; gap: 16px; padding: 12px; box-sizing: border-box; }
    canvas { height: 100%; background: #0d0f14; border-radius: 6px; }
    #info { align-self: flex-end; }
  </style>
</head>
<body>
  <canvas id="strip"></canvas>
  <div id="info">connecting…</div>
  <script>
    // Draws the strip vertically: LED 0 at the bottom, like the real one.
    const canvas = document.getElementById("strip");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");
    let n = 0;

    // Each LED is a wide bar filling its whole slot (minus a hairline gap),
    // so even with ~200 LEDs in one window-height column they're easy to see.
    const STRIP_WIDTH = 50; // CSS px
    const GLOW = 28;        // CSS px of glow on each side of the strip

    function draw(frame) {
      const dpr = devicePixelRatio;
      const h = Math.round(canvas.clientHeight * dpr);
      const w = Math.round((STRIP_WIDTH + GLOW * 2) * dpr);
      if (canvas.height !== h || canvas.width !== w) {
        canvas.height = h;
        canvas.width = w;
        canvas.style.width = `${w / dpr}px`;
      }
      ctx.clearRect(0, 0, w, h);
      const pitch = h / n;
      const gap = pitch > 3 * dpr ? dpr : 0;
      const x = GLOW * dpr;
      const barW = STRIP_WIDTH * dpr;
      for (let i = 0; i < n; i++) {
        const [cr, cg, cb] = [frame[i * 3], frame[i * 3 + 1], frame[i * 3 + 2]];
        const y = h - (i + 1) * pitch;
        const lit = cr + cg + cb > 0;
        ctx.fillStyle = lit ? `rgb(${cr},${cg},${cb})` : "#161921";
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = lit ? GLOW * dpr * 0.6 : 0;
        ctx.fillRect(x, y + gap / 2, barW, pitch - gap);
      }
    }

    function connect() {
      const ws = new WebSocket(`ws://${location.host}/ws/sim`);
      ws.binaryType = "arraybuffer";
      ws.onmessage = (e) => {
        if (typeof e.data === "string") {
          n = JSON.parse(e.data).numLeds;
          info.textContent = `${n} LEDs`;
        } else if (n) {
          draw(new Uint8Array(e.data));
        }
      };
      ws.onclose = () => { info.textContent = "disconnected"; setTimeout(connect, 1000); };
    }
    connect();
  </script>
</body>
</html>
