<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>LED Games</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="conn" class="conn hidden">Connecting…</div>

  <!-- Game list -->
  <section id="view-games" class="view">
    <header class="title-row">
      <h1>LED Games</h1>
      <button class="pill invite-btn">Invite</button>
    </header>
    <div id="game-list" class="list"></div>
    <button class="footer-link" data-nav="device">⚙︎ Device settings</button>
  </section>

  <!-- Device: network, version, updates -->
  <section id="view-device" class="view hidden">
    <button class="back" data-nav="games">‹ Games</button>
    <h1 id="device-name">Device</h1>
    <div class="rows">
      <div class="row"><span>Version</span><span id="device-version"></span></div>
      <div class="row"><span>Wi-Fi</span><span id="device-wifi"></span></div>
      <div class="row"><span>Address</span><span id="device-address"></span></div>
    </div>
    <h2>Updates</h2>
    <p id="update-status" class="muted"></p>
    <button id="update-btn" class="secondary"></button>
    <h2>Wi-Fi</h2>
    <p class="muted">Moving the game to another network? It will start its setup network so you can pick a new one.</p>
    <button id="wifi-setup-btn" class="secondary">Change Wi-Fi network</button>
  </section>

  <!-- Difficulty + settings -->
  <section id="view-setup" class="view hidden">
    <button class="back" data-nav="games">‹ Games</button>
    <h1 id="setup-title"></h1>
    <p id="setup-desc" class="muted"></p>
    <h2>Difficulty</h2>
    <div id="difficulty-list" class="list"></div>
    <div id="settings"></div>
    <button id="start-btn" class="primary">Start</button>
  </section>

  <!-- Playing -->
  <section id="view-play" class="view play hidden">
    <header class="hud">
      <div>
        <div class="label">Score</div>
        <div><span id="score" class="score">0</span><span class="goal"> / <span id="goal">0</span></span></div>
      </div>
      <button id="quit-btn" class="quit">Quit</button>
    </header>
    <div class="danger"><div id="danger-bar"></div></div>
    <div class="arena">
      <div id="tiles" class="tiles"></div>
      <div id="poison" class="poison hidden">
        <div class="poison-text">☠️ Poisoned!</div>
        <div class="poison-bar"><div id="poison-fill"></div></div>
      </div>
    </div>
  </section>

  <!-- Multiplayer lobby -->
  <section id="view-lobby" class="view lobby hidden">
    <h1 id="lobby-title"></h1>
    <p id="lobby-sub" class="muted"></p>
    <div id="lobby-players" class="lobby-players"></div>
    <p id="lobby-hint" class="muted center"></p>
    <button class="pill invite-btn center-pill">Invite friends</button>
    <button id="lobby-main" class="primary"></button>
    <button id="lobby-second" class="secondary"></button>
  </section>

  <!-- Fast Tap -->
  <section id="view-tap" class="view tap hidden">
    <header class="hud">
      <div>
        <div class="label" id="tap-round"></div>
        <div id="tap-board" class="board"></div>
      </div>
      <button id="tap-quit" class="quit hidden">Quit</button>
    </header>
    <button id="tap-pad" class="pad"><span id="tap-msg"></span><small id="tap-sub"></small></button>
  </section>

  <!-- Sumo -->
  <section id="view-sumo" class="view tap hidden">
    <header class="hud">
      <div class="label" id="sumo-label"></div>
      <button id="sumo-quit" class="quit hidden">Quit</button>
    </header>
    <div class="tug"><div id="tug-a"></div><div id="tug-b"></div></div>
    <div class="tug-names"><span id="tug-name-a"></span><span id="tug-name-b"></span></div>
    <div class="sumo-msg"><span id="sumo-msg"></span><small id="sumo-sub"></small></div>
    <div id="sumo-pads" class="pads"></div>
  </section>

  <!-- Simon Says -->
  <section id="view-simon" class="view tap hidden">
    <header class="hud">
      <div>
        <div class="label" id="simon-label"></div>
        <div id="simon-board" class="board"></div>
      </div>
      <button id="simon-quit" class="quit hidden">Quit</button>
    </header>
    <div class="sumo-msg"><span id="simon-msg"></span><small id="simon-sub"></small></div>
    <div id="simon-buttons" class="simon-buttons"></div>
  </section>

  <!-- Someone else is playing -->
  <section id="view-spectate" class="view spectate hidden">
    <div class="emoji">⚔️</div>
    <h1 id="spectate-title"></h1>
    <p id="spectate-sub" class="muted"></p>
    <div id="spectate-shooter">
      <div class="spectate-score">
        <div class="label" id="spectate-label">Score</div>
        <div><span id="spectate-score" class="score">0</span><span class="goal"> / <span id="spectate-goal">0</span></span></div>
      </div>
      <div id="spectate-danger" class="danger"><div id="spectate-danger-bar"></div></div>
    </div>
    <div id="spectate-board" class="board center-board"></div>
  </section>

  <!-- Game over -->
  <section id="view-result" class="view result hidden">
    <div id="result-emoji" class="emoji"></div>
    <h1 id="result-title"></h1>
    <p id="result-sub" class="muted"></p>
    <button id="again-btn" class="primary">Play again</button>
    <button id="home-btn" class="secondary">Back to games</button>
  </section>

  <!-- Invite: QR code other phones scan to open this page -->
  <div id="invite" class="modal hidden">
    <div class="sheet">
      <h1>Join the game</h1>
      <p class="muted">Friends on the same Wi-Fi can scan this with their camera.</p>
      <img id="invite-qr" class="qr" alt="QR code">
      <div id="invite-url" class="invite-url"></div>
      <button id="invite-close" class="primary">Done</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
